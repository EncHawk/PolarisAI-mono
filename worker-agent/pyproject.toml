[project]
name = "polaris-worker"
version = "0.1.0"
description = "LangGraph worker that reads, researches, plans and codes a research paper"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-deepinfra>=0.1.0",
    "langchain-core>=0.3",
    "upstash-redis>=1.7",
    "supabase>=2.9",
    "httpx>=0.27",
    "daytona>=0.200",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "polaris-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Best-effort catch-all in trace/persistence hot paths is intentional.
ignore = ["S110", "BLE001", "TRY002", "TRY003", "RET504", "PLR0915", "PLR0912", "PLR0913", "EM101", "EM102", "T201", "B008", "E402", "SIM105", "SIM108", "PLW1641", "UP008", "SIM117", "E501", "F841", "RUF005", "PLC0415"]
select = ["E", "F", "I", "UP", "B", "SIM"]