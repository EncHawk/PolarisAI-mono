[project]
name = "polaris-backend"
version = "0.1.0"
description = "FastAPI backend for polaris: auth, /ingest, /events, /list"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "google-auth>=2.35",
    "supabase>=2.9",
    "redis>=5.1",
    "llama-index>=0.14",
    "llama-index-readers-file>=0.6",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "cachetools>=5.5",
    "httpx>=0.27",
    "razorpay>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["S110", "BLE001", "TRY003", "RET504", "PLR0915", "PLR0913", "EM101", "EM102", "T201", "B008", "E402", "SIM105", "SIM102", "E501", "PLC0415", "ARG002", "RUF005", "UP007", "B904"]
select = ["E", "F", "I", "UP", "B", "SIM"]
